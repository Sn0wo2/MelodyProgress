name: Build

on:
  workflow_dispatch:
  pull_request:
    paths: &build-paths
      - ".github/workflows/build.yml"
      - "gradle/**"
      - "src/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
  push:
    branches: ["**"]
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://fabricmc.net/develop
          - mc: "26.1.2"
            fabric: "0.155.2+26.1.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "25"
          distribution: microsoft
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Target MC ${{ matrix.mc }}
        run: |
          sed -i 's/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/' gradle.properties
          sed -i 's/^fabric_version=.*/fabric_version=${{ matrix.fabric }}/' gradle.properties
          sed -i 's/"minecraft": "~[^"]*"/"minecraft": "~${{ matrix.mc }}"/' src/main/resources/fabric.mod.json

      - name: Build
        run: ./gradlew build --build-cache

      - name: Upload jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MelodyAlert-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
          archive: false
